# BTC助记词破解工具配置文件

# 助记词长度（支持: 12/15/18/21/24）
mnemonic_size: 12

# 目标BTC地址（支持4种类型，程序按地址格式自动检测，无需配置类型）
# 助记词: tennis endless there vote hawk derive remind mandate couch okay gate grief
# 无密码派生地址:
#   Taproot (BIP86): bc1pj5q0903ldyw4gtqhd8dfyf5raut5qq4v7z0takv3632yhf7pgq4qymknv3
#   Legacy  (BIP44): 1QJake1yux7tfd3h3QmG2irziqizb5u1XN
# 带密码 "123456789" 派生地址 (BIP44/49/84/86, m/x'/0'/0'/0/0):
#   Legacy        (BIP44): 1CmoB5NoXyXJX8dSVBkeRazK8Eq5LT27gN
#   Nested SegWit (BIP49): 3EA5yAVMJZ6kVec9sSRry8QnvSQ3JH5agb
#   Native SegWit (BIP84): bc1qnkcft6kattm6mnju9n7p3qlppyy23r2t3semfg
#   Taproot       (BIP86): bc1pnlgec4pd8ekmhsqdzese7jfqsnae9f6cu99m4f0cz877e3lt4v3sv2s4h7
# 其他参考示例地址:
#   Nested SegWit: 3BSruDfveoFrFG5LSfW77CJcN61ARoMHZj
#   Native SegWit: bc1q5tgrcty99d7d7muxl6kk3xkmkm32c30kn3cyza
target_address: "bc1pnlgec4pd8ekmhsqdzese7jfqsnae9f6cu99m4f0cz877e3lt4v3sv2s4h7"

# 地址类型自动检测规则（无需手动指定）:
# bc1p→Taproot, 1→Legacy, 3→Nested SegWit, bc1q→Native SegWit

# 密码列表（可选）
# 空数组 [] 表示不使用密码
# 示例: ["mypass", "password123"]
passwords: ["123456789"]

# 每位助记词的候选词列表
# 空数组 [] 表示使用全部2048个BIP39单词
# 配置示例: ["kind", "tennis", "able", "endless"]
word_positions:
  word0: [] # 第1位助记词候选列表
  word1: ["endless"] # 第2位助记词候选列表
  word2: ["there"] # 第3位助记词候选列表
  word3: ["vote"] # 第4位助记词候选列表
  word4: ["hawk"] # 第5位助记词候选列表
  word5: ["derive"] # 第6位助记词候选列表
  word6: ["remind"] # 第7位助记词候选列表
  word7: ["mandate"] # 第8位助记词候选列表
  word8: ["couch"] # 第9位助记词候选列表
  word9: ["okay"] # 第10位助记词候选列表
  word10: ["gate"] # 第11位助记词候选列表
  word11: ["grief"] # 第12位助记词候选列表（会被校验位过滤）


# 说明：
# 1. 根据线索配置高概率的候选词
# 2. 不确定的位置留空 []，将使用全部2048个单词
# 3. 最后一位(word11)会被BIP39校验位自动过滤，减少93.75%计算量
# 4. 总搜索空间 = 各位置候选词数量的乘积
#
# 搜索空间限制：
# - 默认限制: 5,000,000 (5百万) 次遍历
# - 超过限制程序会报错并退出
# - 可通过命令行参数调整: --max-search-space 10000000
# - 示例: decrypt-btc --max-search-space 10000000

